<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Myéline — Présentation de l’interface</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { width: 2400px; height: 1500px; }
  body { position: relative; background: var(--ardoise); overflow: hidden; }

  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1500px 1000px at 92% -8%, rgba(95, 125, 153, .62), transparent 62%),
      radial-gradient(1100px 800px at -5% 115%, rgba(14, 18, 24, .55), transparent 65%);
  }
  .watermark { position: absolute; right: -240px; bottom: -120px; width: 1000px; color: var(--brume); opacity: .035; }
  .watermark .dot { fill: var(--brume); }

  .head {
    position: absolute; left: 140px; right: 140px; top: 104px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .head .brand { padding: 0; gap: 18px; }
  .head .brand .sym { width: 56px; }
  .head .word { font-size: 40px; }
  .labels { display: flex; gap: 40px; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: rgba(237, 239, 242, .5); }
  .labels b { font-weight: 400; color: rgba(237, 239, 242, .85); }

  .window {
    position: absolute; left: 360px; top: 236px; width: 1680px;
    border-radius: 18px; overflow: hidden;
    background: #E8EBEF;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 60px 140px -30px rgba(0, 0, 0, .65), 0 20px 50px -20px rgba(0, 0, 0, .4);
  }
  .bar { position: relative; height: 54px; display: flex; align-items: center; padding: 0 22px; gap: 10px; border-bottom: 1px solid #DDE1E6; }
  .bar .tl { width: 13px; height: 13px; border-radius: 50%; background: #C9CED6; }
  .url {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 460px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    background: #fff; box-shadow: 0 0 0 1px rgba(35, 42, 53, .06);
    font-size: 13px; color: var(--gris);
  }
  .url .ic { width: 13px; height: 13px; color: var(--acier); }
  .url .ic svg { stroke-width: 2.2; }
  .url b { font-weight: 400; color: var(--ardoise); }
  .window img { display: block; width: 1680px; height: 1050px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <svg class="sym watermark" viewBox="0 0 100 61"><path class="arc" d="M5.5 11a44.5 44.5 0 0 0 89 0"/><circle class="dot" cx="50" cy="15.5" r="15.5"/></svg>

  <div class="head">
    <div class="brand">
      <svg class="sym" viewBox="0 0 100 61"><path class="arc" d="M5.5 11a44.5 44.5 0 0 0 89 0"/><circle class="dot" cx="50" cy="15.5" r="15.5"/></svg>
      <span class="word">myéline</span>
    </div>
    <div class="labels mono"><span>Interface · <b>Assistant IA</b></span><span>Sur site · <b>Environnement privé</b></span></div>
  </div>

  <div class="window">
    <div class="bar">
      <span class="tl"></span><span class="tl"></span><span class="tl"></span>
      <div class="url mono"><i data-i="lock"></i><span><b>assistant.myeline</b>.local</span></div>
    </div>
    <img src="../exports/myeline-accueil.png" alt="">
  </div>
</body>
</html>
